name: Apply BoranTheGreat premium redesign

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-premium-redesign.yml"
      - "scripts/apply-premium-redesign.mjs"
      - "scripts/premium-redesign-templates/**"

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply premium redesign
        run: node scripts/apply-premium-redesign.mjs

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            npm install --global pnpm@9
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Run lint
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm run lint; else npm run lint; fi

      - name: Run production build
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm run build; else npm run build; fi
        env:
          NEXT_PUBLIC_SITE_URL: https://boranthegreat.xyz
          NEXT_PUBLIC_APP_NAME: BoranTheGreat

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app components PREMIUM_REFRESH_REPORT.md
          for optional_path in data lib package-lock.json; do
            if [ -e "$optional_path" ]; then git add -A -- "$optional_path"; fi
          done
          if git diff --cached --quiet; then
            echo "No new changes to commit."
            exit 0
          fi
          git commit -m "Apply premium homepage and navigation refresh"
          git push
