name: Apply BoranTheGreat premium redesign FINAL

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-premium-redesign-final.yml"

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply premium redesign
        run: node scripts/apply-premium-redesign.mjs

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app components PREMIUM_REFRESH_REPORT.md
          for optional_path in data lib; do
            if [ -e "$optional_path" ]; then git add -A -- "$optional_path"; fi
          done
          if git diff --cached --quiet; then
            echo "No new changes to commit."
            exit 0
          fi
          git commit -m "Apply premium homepage and navigation refresh"
          git push
