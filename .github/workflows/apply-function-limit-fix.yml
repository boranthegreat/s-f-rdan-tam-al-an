name: Apply Vercel function-limit fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-function-limit-fix.yml"
      - "scripts/apply-function-limit-fix.sh"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply function-limit fix
        run: bash scripts/apply-function-limit-fix.sh

      - name: Save repaired project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix Vercel function limit"
            git push
          fi
